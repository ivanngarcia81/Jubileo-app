<!-- El logo de Jubileo Financiero: el anillo partido con la J y la F.
     Va en su versión para fondo oscuro (la mitad negra en blanco), porque el
     cuadro de atrás es carbón. La marca en sí es un PNG incrustado: viene de
     design/logo-jf.png y no se redibuja aquí. Los colores del cuadro salen de
     design/design-tokens.css; un SVG no lee variables de CSS, así que va
     escrito. Si cambia el token, cambia aquí. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#1C1E1F"/>
  <image x="97" y="105" width="318" height="304" href="data:image/png;base64,"/>
</svg>
